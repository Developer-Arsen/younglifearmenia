name = "younglifearmenia"
main = "src/index.js"
compatibility_date = "2024-01-01"

# The built site. Assets are matched before the Worker runs, so only
# /video/* reaches src/index.js. dist/ is produced by ./build.sh, which
# must therefore run as the Cloudflare build command.
[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "younglife-media"
